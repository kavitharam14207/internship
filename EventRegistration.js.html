<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <script src="js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<style>
    .bg {
        background-color: rgb(239, 240, 234);
        color: rgb(11, 11, 11);
    }
</style>

<body class="bg text-center p-5">
    <h1 class="text-center" style="color:rgb(21, 18, 6); padding: auto;">Event Registration Form</h1>
    <h5 class="text-center" style="color:rgb(244, 88, 5);">Tech Webinar 2026</h5>
    <h2 class="text-center" style="color:rgb(229, 195, 2) ; padding: 20px;">Register now to secure your virtual seat !
    </h2>
    <form onsubmit="return validate()">
        Enter your full Name: <input type="text" id="name"><br><br>
        Email Address: <input type="text" id="Email"><br><br>
        Department: <input type="text" id="dept"><br><br>
        <button type="Register Now" class="btn btn-primary ">Register Now</button>
    </form>
    <script>
        function validate() {
            let name = document.getElementById("name").value;
            let Email = document.getElementById("Email").value;
            let depart = document.getElementById("depart").value;
            if (name == "" || Email == "" || dept == "") {
                alert("All fields required!");
                return false;
            }
            alert("Registration Successful !");
            return true;
        }
    </script>
</body>

</html>
