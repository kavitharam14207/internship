<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu card</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <script src="js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body style="background-color: #faa307;">
    <h1 class="text-center" style="color: #370617;"> Menu Card</h1>
    <div class="row">
        <div class="col">
            <div class="card text-center" style="background-color:#fcf7f4; color:#03071e;">
                <div class="text-center" style=" padding-top: 10px;">
                    <img src="public1/burger.jpg" alt=" veggie" class="rounded-1" width="200" height="200">
                </div>
                <div class="card-body">
                    <h5 class="card-title" style="color: #370617;">Crispy Veggie Burger <span
                            class="badge rounded-pill bg-success"><i class="fa-solid fa-star"
                                style="color: rgb(229, 242, 236);"></i> 4.5 </span></h5>
                    <p class="card-text" style="color:#370617;"> Freshly toasted buns with crisp veggie patty and secret
                        sauce.
                    </p>
                    <p class="text-dark">Price: $4.99</p>
                    <div class="text-center pt-1">
                        <a href="https://www.zomato.com/" class="btn btn-success">Order Now</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card text-center" style="background-color:#fcf7f4; color:#03071e;">
                <div class="text-center" style=" padding-top: 10px;">
                    <img src="public1/non.webp" alt="non veggie" class="rounded-1" width="200" height="200">
                </div>
                <div class="card-body">
                    <h5 class="card-title" style="color: #370617;">Crispy Non Veggie Burger <span
                            class="badge rounded-pill bg-success"><i class="fa-solid fa-star"
                                style="color: rgb(229, 242, 236);"></i> 5.5 </span></h5>
                    <p class="card-text" style="color:#370617;"> Freshly toasted buns with crisp Non veggie patty and
                        secret sauce.
                    </p>
                    <p class="text-dark">Price: $5.99</p>
                    <div class="text-center pt-1">
                        <a href="https://www.zomato.com/" class="btn btn-success">Order Now</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
